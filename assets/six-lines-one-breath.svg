    <radialGradient id="warmth" cx="70%" cy="50%" r="52%">
      <stop offset="0" stop-color="#d8764b" stop-opacity=".35"/>
      <stop offset=".38" stop-color="#c65b39" stop-opacity=".13"/>
      <stop offset="1" stop-color="#c65b39" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8da9b5" stop-opacity=".48"/>
      <stop offset=".43" stop-color="#d6e0dd" stop-opacity=".82"/>
      <stop offset=".76" stop-color="#f0eee8"/>
      <stop offset="1" stop-color="#f0eee8" stop-opacity=".9"/>
    </linearGradient>
    <pattern id="air" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".35" fill="#f0eee8" opacity=".18"/>
    </pattern>
  </defs>
  <rect width="1000" height="760" fill="#14262c"/>
  <rect width="1000" height="760" fill="url(#air)"/>
