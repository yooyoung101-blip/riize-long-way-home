<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc">
  <title id="title">Six Lines / One Breath</title>
  <desc id="desc">Six individual lines begin at different distances, bend through a shared field of warmth, and continue side by side without merging.</desc>
